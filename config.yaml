# Add `light: true` to a fan that has a physical light to expose a separate
# light entity for it (e.g. in Home Assistant). The `toggle_light` command
# works regardless. Defaults to false (no light).
fans:
  - { name: palapa1,    vendor: vendor_a, device_id: 0x87552 }
  - { name: palapa2,    vendor: vendor_a, device_id: 0x861A6 }
  - { name: palapa3,    vendor: vendor_a, device_id: 0x86274 }
  - { name: galleria1,  vendor: vendor_b, device_id: 0xED13F }
  - { name: galleria2,  vendor: vendor_a, device_id: 0x87AD7 }
  - { name: galleria3,  vendor: vendor_a, device_id: 0x8643E }
  - { name: guest,      vendor: vendor_a, device_id: 0x87154 }

rooms:
  main: "*"
  palapa: "palapa*"
  galleria: "galleria*"
