title: Fan Controller
views:
  - title: Fans
    path: fans
    icon: mdi:fan
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Palapa
            icon: mdi:fan
          - type: grid
            columns: 4
            square: false
            cards:
              - type: button
                name: "Off"
                icon: mdi:fan-off
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  data:
                    topic: fanctrl/palapa/set
                    payload: "OFF"
              - type: button
                name: "1"
                icon: mdi:numeric-1
                tap_action:
