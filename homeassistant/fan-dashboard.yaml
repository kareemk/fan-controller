title: Fan Controller
views:
  - title: Fans
    path: fans
    icon: mdi:fan
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Palapa
            icon: mdi:fan
          - type: entities
            entities:
              - entity: input_select.palapa_fan_target
                name: Target
          - type: grid
            columns: 4
            square: false
            cards:
              - type: button
                name: "Off"
                icon: mdi:fan-off
                tap_action:
                  action: perform-action
                  perform_action: script.fan_controller_send
                  data:
                    room: palapa
                    command: "off"
              - type: button
                name: "1"
                icon: mdi:numeric-1
                tap_action:
                  action: perform-action
                  perform_action: script.fan_controller_send
                  data:
                    room: palapa
                    command: "1"
              - type: button
