input_select:
  palapa_fan_target:
    name: Palapa target
    icon: mdi:target
    options:
      - All
      - Fan 1
      - Fan 2
      - Fan 3
    initial: All

  galleria_fan_target:
    name: Galleria target
    icon: mdi:target
    options:
      - All
      - Fan 1
      - Fan 2
      - Fan 3
    initial: All

script:
  fan_controller_send:
    alias: Send fan controller command
    description: Send a speed or off command to the selected fan in a room.
    icon: mdi:fan
    mode: queued
    max: 10
    fields:
      room:
        name: Room
        required: true
        selector:
          select:
            options:
              - palapa
              - galleria
      command:
        name: Command
        required: true
        selector:
          select:
            options:
              - "off"
              - "1"
              - "2"
              - "3"
              - "4"
              - "5"
              - "6"
    sequence:
      - variables:
          selected_target: >-
            {% set selectors = {
              'palapa': 'input_select.palapa_fan_target',
              'galleria': 'input_select.galleria_fan_target'
            } %}
            {% set selector = selectors.get(room) %}
            {{ states(selector) if selector else 'All' }}
      - variables:
          mqtt_target: >-
            {% set suffixes = {
              'All': '',
              'Fan 1': '1',
              'Fan 2': '2',
              'Fan 3': '3'
            } %}
            {{ room ~ suffixes.get(selected_target, '') }}
      - action: mqtt.publish
        data:
          topic: >-
            fanctrl/{{ mqtt_target }}/{{ 'set' if command | string | lower == 'off' else 'preset/set' }}
          payload: >-
            {{ 'OFF' if command | string | lower == 'off' else command }}
