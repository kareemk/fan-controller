# Minimal broker config for a trusted home LAN.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# For a locked-down setup, disable anonymous and add a password file instead:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# (create it with: docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd fanctrl)
# then run the bridge with --mqtt-user / --mqtt-pass.
